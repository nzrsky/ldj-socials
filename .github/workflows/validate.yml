name: Validate
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate socials.tsv
        run: |
          awk -F'\t' '
          /^#/ || /^$/ { next }
          NF != 3 { print "Bad columns (line " NR "): " $0; err=1; next }
          $2 !~ /^(twitter|bsky|youtube|itch|github|steam|name)$/ { print "Unknown field \"" $2 "\" (line " NR ")"; err=1 }
          $2 != "name" && $3 !~ /^https?:\/\// { print "Bad URL \"" $3 "\" (line " NR ")"; err=1 }
          END { exit err+0 }
          ' socials.tsv
